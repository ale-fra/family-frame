<!doctype html>
<!--
  Design proposals for timers and routines on the frame (static mockup, not part of the app).
  Views: ?view=board  |  ?view=stage&scene=one|two|mix|overflow   and  &lang=it|en
  Built by build.mjs: phases, order, the 3-item limit, remaining-time text and sweets blocks come from the frame's
  REAL code (src/frame/lib/scheduleDisplay.ts, scheduleIcons.ts). Only the drawing of each style is mockup code.
-->
<html>
<head>
<meta charset="utf-8">
<title>Family Frame – timers & routines proposals</title>
<style>
  :root { --ink:#26312e; --paper:#fffcf4; --muted:#6d756f; --calm:#2f9e8f; --calm-soft:#d7efe9;
          --soon:#e59400; --soon-soft:#fdefc9; --ring:#e4572e; --pause:#9aa39e; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: "Nunito", "Varela Round", ui-rounded, system-ui, sans-serif; color:var(--ink); background:#eee8dc; }
  h1,h2 { margin:0; }
  /* ---------- board ---------- */
  .board { padding:28px 32px; width:1280px; }
  .board h1 { font-size:26px; margin-bottom:4px; }
  .board .sub { color:var(--muted); margin-bottom:20px; font-size:15px; }
  .row, .col-heads { display:grid; grid-template-columns: 210px repeat(4, minmax(0, 1fr)); gap:14px; }
  .row { align-items:stretch; margin-bottom:14px; }
  .row-head { display:flex; flex-direction:column; justify-content:center; padding:8px 4px; }
  .row-head h2 { font-size:19px; }
  .row-head p { margin:6px 0 0; font-size:13px; color:var(--muted); line-height:1.35; }
  .row-head code { font-size:12px; background:#e7e1d4; padding:1px 5px; border-radius:5px; }
  .col-heads { margin-bottom:8px; }
  .col-heads div { font-weight:800; font-size:14px; color:var(--muted); text-align:center; }
  /* ---------- item card (board and stage) ---------- */
  .card { background:var(--paper); border-radius:22px; box-shadow:0 8px 22px rgba(79,67,49,.10);
          display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; min-width:0; }
  .card .title { font-weight:900; line-height:1.1; display:flex; align-items:center; gap:.35em; justify-content:center; }
  .card .remaining { font-weight:900; line-height:1; }
  .card .remaining small { font-size:.5em; margin-left:.12em; }
  .card .meta { color:var(--muted); font-weight:800; }
  .card.ringing { background:var(--ring); color:white; }
  .card.ringing .meta { color:rgba(255,255,255,.85); }
  .badge { display:inline-flex; align-items:center; gap:.35em; padding:.25em .8em; border-radius:999px; font-weight:900; white-space:nowrap; }
  .ringing .badge { background:white; color:var(--ring); }
  .paused .badge { background:#e7ebe8; color:#5b645f; }
  .icon-chip { display:grid; place-items:center; border-radius:50%; background:white; color:var(--ink); box-shadow:0 2px 6px rgba(0,0,0,.12); }
  .blocks { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; }
  .block { border-radius:10px; border:3px solid currentColor; position:relative; overflow:hidden; }
  .block > i { position:absolute; left:0; right:0; bottom:0; background:currentColor; }
  /* ---------- frame ---------- */
  .frame { width:1280px; height:800px; padding:20px; display:grid; grid-template-columns:790px 430px; gap:20px;
           background:linear-gradient(90deg, rgba(255,252,244,.92), rgba(234,227,214,.92)), #eee8dc; position:relative; overflow:hidden; }
  .stage { position:relative; border-radius:8px; overflow:hidden; padding:22px; display:grid; gap:18px;
           background: radial-gradient(circle at 20% 10%, #fffaf0 0, #f6efe1 55%, #efe6d4 100%); }
  .stage.n1 { grid-template: 1fr / 1fr; }
  .stage.n2 { grid-template: 1fr / 1fr 1fr; }
  .stage.n3 { grid-template: 1fr 1fr / 1.25fr 1fr; }
  .stage.n3 > .card:first-child { grid-row: 1 / 3; }
  .more { position:absolute; right:30px; bottom:26px; background:var(--ink); color:white; border-radius:999px; padding:8px 16px;
          font-weight:900; font-size:18px; box-shadow:0 6px 16px rgba(0,0,0,.2); }
  .panel { display:flex; flex-direction:column; gap:16px; padding:24px 28px; border-radius:8px; background:rgba(255,252,244,.86);
           border:1px solid rgba(100,87,68,.16); box-shadow:0 18px 42px rgba(79,67,49,.12); min-width:0; }
  .date { font-size:18px; color:#5b645f; font-weight:700; }
  .clock-row { display:flex; justify-content:space-between; align-items:center; }
  .time { font-size:64px; font-weight:800; line-height:1; letter-spacing:-.02em; }
  .weather { display:flex; align-items:center; gap:8px; font-size:34px; font-weight:800; }
  .weather svg { color:#e0a12b; }
  .section-label { font-size:13px; font-weight:900; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin-top:8px; }
  .event { display:grid; grid-template-columns:92px 1fr; gap:10px; font-size:17px; padding:8px 0; border-bottom:1px solid rgba(100,87,68,.12); }
  .event b { color:#5b645f; font-weight:800; }
  .note { position:absolute; right:26px; bottom:8px; font-size:12px; color:var(--muted); }
</style>
</head>
<body>
<div id="root"></div>
<script>/*FRAME_SCHEDULE_LIB*/</script>
<script>
const ICONS = /*ICONS*/{};
const { buildDisplayItems, selectVisibleItems, formatRemaining, sweetsLayout } = FrameSchedule;
const params = new URLSearchParams(location.search);
const lang = params.get("lang") || "it";
const TIME_ZONE = "Europe/Rome";
const T = {
  it: {
    locale: "it-IT",
    board: "Stili del conto alla rovescia (configurabili)",
    boardSub: "Lo stesso timer da 10 minuti in quattro momenti. Predefinito in .env (FRAME_TIMER_STYLE, FRAME_ROUTINE_STYLE), sovrascrivibile per ogni timer o routine con \"style\". Il colore cambia con la fase, ma anche forma e dimensione.",
    cols: ["8 min rimasti", "45 s rimasti (ultimo minuto)", "Tempo scaduto", "In pausa"],
    rows: {
      disc: ["Disco del tempo", "Lo spicchio colorato si restringe, come il \"Time Timer\"."],
      sweets: ["Caramelle", "Un blocco per minuto (max 12 blocchi: poi 5, 10, 15… min per blocco)."],
      journey: ["Il viaggio", "La lumaca cammina verso l'icona del timer."],
      clock: ["Orologio", "Lancette vere e una zona verde fino all'ora. Predefinito per le routine."]
    },
    timeUp: "Tempo scaduto!", itsTime: "È ora!", paused: "In pausa", at: "alle", more: (n) => `+${n} altro`,
    pasta: "Pasta pronta", school: "Scuola", teeth: "Lavare i denti", bins: "Fuori la spazzatura", lego: "Riordinare i Lego", bath: "Bagnetto",
    date: "Giovedì 4 dicembre", events: "Prossimi eventi",
    ev: [["ven 5", "Recita di Natale"], ["sab 6", "Compleanno nonna"], ["lun 8", "Immacolata"]], note: "Mockup · proposta"
  },
  en: {
    locale: "en-GB",
    board: "Countdown styles (configurable)",
    boardSub: "The same 10-minute timer at four moments. Default in .env (FRAME_TIMER_STYLE, FRAME_ROUTINE_STYLE), overridable per timer or routine with \"style\". Colour changes with the phase, and so do shape and size.",
    cols: ["8 min left", "45 s left (last minute)", "Time's up", "Paused"],
    rows: {
      disc: ["Time disc", "The coloured slice shrinks, like the classroom \"Time Timer\"."],
      sweets: ["Sweets", "One block per minute (max 12 blocks: then 5, 10, 15… min per block)."],
      journey: ["The journey", "The snail walks towards the timer's icon."],
      clock: ["Clock", "Real hands and a green zone up to the time. Default for routines."]
    },
    timeUp: "Time's up!", itsTime: "It's time!", paused: "Paused", at: "at", more: (n) => `+${n} more`,
    pasta: "Pasta is ready", school: "School", teeth: "Brush teeth", bins: "Bins out", lego: "Tidy up the Lego", bath: "Bath time",
    date: "Thursday 4 December", events: "Upcoming events",
    ev: [["Fri 5", "Christmas play"], ["Sat 6", "Grandma's birthday"], ["Mon 8", "Swimming"]], note: "Mockup · proposal"
  }
}[lang];

// Same resolution as resolveScheduleIcon(): null → the kind's default, unknown key → "!" (SVGs rendered from it).
const iconSvg = (key, kind, size) => sized(key === null ? ICONS[kind] : ICONS.byKey[key] ?? ICONS.unknown, size);
const uiIcon = (name, size) => sized(ICONS.ui[name], size);
const sized = (svg, size) => svg.replace('width="24" height="24"', `width="${size}" height="${size}"`);
const color = (phase) => ({ counting: "var(--calm)", soon: "var(--soon)", ringing: "var(--ring)", paused: "var(--pause)" })[phase];
const hhmm = (ms) => new Intl.DateTimeFormat(T.locale, { hour: "2-digit", minute: "2-digit", timeZone: TIME_ZONE }).format(ms);

// ---------- scene data: exactly what GET /api/schedule would return ----------
const MIN = 60000, iso = (ms) => new Date(ms).toISOString();
let seq = 0;
function timer(now, { title, icon, style, durationMs, remainingMs = durationMs, status = "running", ringingForMs = 0 }) {
  const id = `t${++seq}`, base = { id, title, icon, style, durationMs, autoDismissMs: MIN, closedAt: null, createdAt: iso(now), updatedAt: iso(now) };
  if (status === "paused") return { ...base, status, remainingMs, endsAt: null, finishedAt: null, dismissAt: null };
  if (status === "finished") {
    const finished = now - ringingForMs;
    return { ...base, status, remainingMs: 0, endsAt: iso(finished), finishedAt: iso(finished), dismissAt: iso(finished + MIN) };
  }
  return { ...base, status, remainingMs, endsAt: iso(now + remainingMs), finishedAt: null, dismissAt: null };
}
function occurrence(now, { title, icon, style, inMs, noticeMinutes }) {
  const at = now + inMs;
  return { routineId: `r${++seq}`, title, icon, style, date: "2025-12-04", at: iso(at), showFrom: iso(at - noticeMinutes * MIN),
    dismissAt: iso(at + MIN), noticeMinutes, dismissed: false };
}
const schedule = (now, timers = [], routines = []) => ({ serverTime: iso(now), timeZone: TIME_ZONE, timers, routines });

// ---------- visuals (the only mockup-specific code) ----------
function disc(item, size) {
  const r = size / 2 - size * 0.06, c = size / 2;
  const fill = item.phase === "ringing" ? "rgba(255,255,255,.35)" : color(item.phase);
  const angle = item.phase === "ringing" ? 360 : item.fraction * 360;
  const x = c + r * Math.sin(angle * Math.PI / 180), y = c - r * Math.cos(angle * Math.PI / 180);
  const sector = angle >= 359.9 ? `<circle cx="${c}" cy="${c}" r="${r}" fill="${fill}"/>` : angle <= 0 ? ""
    : `<path d="M${c},${c} L${c},${c - r} A${r},${r} 0 ${angle > 180 ? 1 : 0} 1 ${x},${y} Z" fill="${fill}"/>`;
  const tick = item.phase === "ringing" ? "rgba(255,255,255,.6)" : "#b9b2a4";
  const ticks = Array.from({ length: 12 }, (_, i) => {
    const a = i * 30 * Math.PI / 180, r1 = r + size * 0.015, r2 = r + size * 0.045;
    return `<line x1="${c + r1 * Math.sin(a)}" y1="${c - r1 * Math.cos(a)}" x2="${c + r2 * Math.sin(a)}" y2="${c - r2 * Math.cos(a)}" stroke="${tick}" stroke-width="${i % 3 ? size * .012 : size * .025}" stroke-linecap="round"/>`;
  }).join("");
  const face = item.phase === "ringing" ? "rgba(255,255,255,.18)" : "#f1ece2";
  const chip = size * 0.34;
  return `<div style="position:relative;width:${size}px;height:${size}px;flex:none">
    <svg width="${size}" height="${size}"><circle cx="${c}" cy="${c}" r="${r}" fill="${face}"/>${sector}${ticks}</svg>
    <div class="icon-chip" style="position:absolute;left:${c - chip / 2}px;top:${c - chip / 2}px;width:${chip}px;height:${chip}px;color:${item.phase === "ringing" ? "var(--ring)" : "var(--ink)"}">${iconSvg(item.icon, item.kind, chip * .56)}</div></div>`;
}

function sweets(item, size) {
  if (item.phase === "ringing") return `<div style="color:white">${uiIcon("PartyPopper", size * .55)}</div>`;
  const { fills } = sweetsLayout(item.totalMs, item.remainingMs);
  const w = Math.min(size * .2, 46), h = w * 1.25;
  return `<div class="blocks" style="max-width:${size * 1.25}px">${fills.map((fill) =>
    `<div class="block" style="width:${w}px;height:${h}px;color:${color(item.phase)}"><i style="height:${fill * 100}%"></i></div>`).join("")}</div>`;
}

function journey(item, size) {
  const width = size * 1.3, done = 1 - item.fraction, track = width - size * .42, x = size * .06 + done * track;
  const dotColor = item.phase === "ringing" ? "white" : color(item.phase);
  const dots = Array.from({ length: 10 }, (_, i) => {
    const dx = size * .06 + i * track / 9;
    return `<circle cx="${dx + size * .09}" cy="${size * .34}" r="${size * .022}" fill="${dx < x ? dotColor : (item.phase === "ringing" ? "rgba(255,255,255,.35)" : "#ddd5c6")}"/>`;
  }).join("");
  const s = size / 110;
  return `<svg width="${width}" height="${size * .5}">${dots}
    <g transform="translate(${Math.min(x, width - size * .6)},${size * .12}) scale(${1.5 * s})" style="color:${item.phase === "ringing" ? "white" : color(item.phase)}">${ICONS.ui.Snail}</g>
    <g transform="translate(${width - size * .33},${size * .1}) scale(${1.6 * s})" style="color:${item.phase === "ringing" ? "white" : "var(--ink)"}">${iconSvg(item.icon, item.kind, 24)}</g></svg>`;
}

function clockFace(item, size, nowMs) {
  const c = size / 2, r = size / 2 - size * .05;
  const [nh, nm] = hhmm(nowMs).split(":").map(Number);
  const pt = (deg, rad) => [c + rad * Math.sin(deg * Math.PI / 180), c - rad * Math.cos(deg * Math.PI / 180)];
  // Zone = time left, on the minute dial (empty once due, full circle for an hour or more).
  const from = nm * 6, sweep = Math.min(359.9, Math.max(0, (item.dueAtMs - nowMs) / MIN) * 6), to = from + sweep;
  const [x1, y1] = pt(from, r * .96), [x2, y2] = pt(to, r * .96);
  const wedge = sweep > 0 ? `<path d="M${c},${c} L${x1},${y1} A${r * .96},${r * .96} 0 ${sweep > 180 ? 1 : 0} 1 ${x2},${y2} Z" fill="var(--calm-soft)" stroke="var(--calm)" stroke-width="${size * .015}"/>` : "";
  const ticks = Array.from({ length: 12 }, (_, i) => { const [a, b] = pt(i * 30, r * .96), [d, e] = pt(i * 30, r * (i % 3 ? .86 : .78));
    return `<line x1="${a}" y1="${b}" x2="${d}" y2="${e}" stroke="#6d756f" stroke-width="${size * (i % 3 ? .015 : .03)}" stroke-linecap="round"/>`; }).join("");
  const [hx, hy] = pt((nh % 12 + nm / 60) * 30, r * .5), [mx, my] = pt(nm * 6, r * .8);
  const chip = size * .3;
  return `<div style="position:relative;width:${size}px;height:${size}px;flex:none"><svg width="${size}" height="${size}">
    <circle cx="${c}" cy="${c}" r="${r}" fill="white" stroke="${item.phase === "ringing" ? "rgba(255,255,255,.6)" : "#d8d0c2"}" stroke-width="${size * .025}"/>${wedge}${ticks}
    <circle cx="${x2}" cy="${y2}" r="${size * .055}" fill="var(--calm)"/>
    <line x1="${c}" y1="${c}" x2="${hx}" y2="${hy}" stroke="var(--ink)" stroke-width="${size * .05}" stroke-linecap="round"/>
    <line x1="${c}" y1="${c}" x2="${mx}" y2="${my}" stroke="var(--ink)" stroke-width="${size * .032}" stroke-linecap="round"/>
    <circle cx="${c}" cy="${c}" r="${size * .04}" fill="var(--ink)"/></svg>
    <div class="icon-chip" style="position:absolute;right:${-chip * .15}px;bottom:${-chip * .1}px;width:${chip}px;height:${chip}px;background:${item.phase === "ringing" ? "white" : "var(--calm-soft)"};color:${item.phase === "ringing" ? "var(--ring)" : "var(--ink)"}">${iconSvg(item.icon, item.kind, chip * .58)}</div></div>`;
}

const VISUALS = { disc, sweets, journey, clock: clockFace };

function card(item, size, nowMs, extraStyle = "") {
  const { value, unit } = formatRemaining(item.remainingMs);
  const status = item.phase === "ringing"
    ? `<span class="badge" style="font-size:${size * .12}px">${uiIcon("Bell", size * .12)} ${item.kind === "routine" ? T.itsTime : T.timeUp}</span>`
    : item.phase === "paused"
      ? `<span class="badge" style="font-size:${size * .11}px">${uiIcon("Pause", size * .11)} ${T.paused} · ${value} ${unit}</span>`
      : `<span class="remaining" style="font-size:${size * .3}px;color:${color(item.phase)}">${value}<small>${unit}</small></span>`;
  const meta = item.kind === "routine" && item.phase !== "ringing" ? `<div class="meta" style="font-size:${size * .1}px">${T.at} ${hhmm(item.dueAtMs)}</div>` : "";
  return `<div class="card ${item.phase}" data-key="${item.key}" style="padding:${size * .1}px;gap:${size * .06}px;${extraStyle}">
    ${VISUALS[item.style](item, size, nowMs)}
    <div class="title" style="font-size:${size * .15}px">${item.title}</div>${status}${meta}</div>`;
}

// ---------- board: each cell is one item computed by buildDisplayItems ----------
function board() {
  // The school run is due at 08:10 in Rome; each cell looks at it (or at a timer) from its own moment.
  const SCHOOL_AT = Date.parse("2025-12-04T07:10:00Z");
  const pasta = { title: T.pasta, icon: "pot", durationMs: 10 * MIN };
  const school = (now, style) => occurrence(now, { title: T.school, icon: "backpack", style, inMs: SCHOOL_AT - now, noticeMinutes: 10 });
  const at = (ms) => [ms, ms];
  const moments = (style) => (style === "clock"
    ? [at(SCHOOL_AT - 8 * MIN), at(SCHOOL_AT - 45000), at(SCHOOL_AT + 10000)].map(([now]) => [now, schedule(now, [], [school(now, style)])])
      .concat([[SCHOOL_AT - 8 * MIN, schedule(SCHOOL_AT - 8 * MIN, [timer(SCHOOL_AT - 8 * MIN, { ...pasta, style, status: "paused", remainingMs: 6 * MIN })])]])
    : [
        [SCHOOL_AT, schedule(SCHOOL_AT, [timer(SCHOOL_AT, { ...pasta, style, remainingMs: 8 * MIN })])],
        [SCHOOL_AT, schedule(SCHOOL_AT, [timer(SCHOOL_AT, { ...pasta, style, remainingMs: 45000 })])],
        [SCHOOL_AT, schedule(SCHOOL_AT, [timer(SCHOOL_AT, { ...pasta, style, status: "finished", ringingForMs: 10000 })])],
        [SCHOOL_AT, schedule(SCHOOL_AT, [timer(SCHOOL_AT, { ...pasta, style, status: "paused", remainingMs: 6 * MIN })])]
      ]);
  const rows = Object.entries(T.rows).map(([style, [name, text]]) => `<div class="row">
    <div class="row-head"><h2>${name}</h2><p>${text}</p><p><code>style: "${style}"</code></p></div>
    ${moments(style).map(([now, data]) => card(buildDisplayItems(data, now)[0], 118, now, "min-height:250px")).join("")}</div>`).join("");
  return `<div class="board"><h1>${T.board}</h1><div class="sub">${T.boardSub}</div>
    <div class="col-heads"><div></div>${T.cols.map((c) => `<div>${c}</div>`).join("")}</div>${rows}</div>`;
}

// ---------- stage: the whole photo area while something is on ----------
const MORNING = Date.parse("2025-12-04T06:58:00Z"); // 07:58 in Rome
const EVENING = Date.parse("2025-12-04T18:30:00Z"); // 19:30 in Rome
const SCENES = {
  one: () => [MORNING, schedule(MORNING, [timer(MORNING, { title: T.pasta, icon: "pot", style: "disc", durationMs: 10 * MIN, remainingMs: 7 * MIN })])],
  two: () => [MORNING, schedule(MORNING, [
    timer(MORNING, { title: T.pasta, icon: "pot", style: "disc", durationMs: 10 * MIN, remainingMs: 7 * MIN }),
    timer(MORNING, { title: T.teeth, icon: "sparkles", style: "sweets", durationMs: 3 * MIN, remainingMs: 45000 })
  ])],
  mix: () => [MORNING, schedule(MORNING, [
    timer(MORNING, { title: T.teeth, icon: "sparkles", style: "sweets", durationMs: 3 * MIN, remainingMs: 45000 }),
    timer(MORNING, { title: T.pasta, icon: "pot", style: "journey", durationMs: 10 * MIN, status: "finished", ringingForMs: 10000 })
  ], [occurrence(MORNING, { title: T.school, icon: "backpack", style: "clock", inMs: 12 * MIN, noticeMinutes: 15 })])],
  overflow: () => [EVENING, schedule(EVENING, [
    timer(EVENING, { title: T.lego, icon: "puzzle", style: "disc", durationMs: 10 * MIN, status: "paused", remainingMs: 4 * MIN }),
    timer(EVENING, { title: T.bath, icon: "rubber-duck", style: "disc", durationMs: 12 * MIN, remainingMs: 9 * MIN }), // unknown icon → "!"
    timer(EVENING, { title: T.teeth, icon: "sparkles", style: "journey", durationMs: 3 * MIN, remainingMs: 2 * MIN })
  ], [occurrence(EVENING, { title: T.bins, icon: "trash", style: "disc", inMs: -10000, noticeMinutes: 15 })])]
};

function stage(scene) {
  const [now, data] = SCENES[scene]();
  const { visible, hiddenCount } = selectVisibleItems(buildDisplayItems(data, now));
  const n = visible.length;
  const size = (index) => n === 1 ? 330 : n === 2 ? 230 : index === 0 ? 250 : 160;
  return `<div class="frame">
    <div class="stage n${n}">${visible.map((item, index) => card(item, size(index), now)).join("")}
      ${hiddenCount > 0 ? `<div class="more">${T.more(hiddenCount)}</div>` : ""}</div>
    <aside class="panel">
      <div class="date">${T.date}</div>
      <div class="clock-row"><div class="time">${hhmm(now)}</div><div class="weather">${uiIcon("Sun", 38)} 9°</div></div>
      <div class="section-label">${T.events}</div>
      <div>${T.ev.map(([d, t]) => `<div class="event"><b>${d}</b><span>${t}</span></div>`).join("")}</div>
    </aside>
    <div class="note">${T.note}</div>
  </div>`;
}

document.getElementById("root").innerHTML = params.get("view") === "stage" ? stage(params.get("scene") || "one") : board();
</script>
</body>
</html>
